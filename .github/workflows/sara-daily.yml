name: Sara daily run

on:
  schedule:
    # Sara wakes every hour and checks each person's schedule from the
    # dashboard (time, days, time zone, paused or on duty), then works only
    # for those who are due. Most wake-ups finish in seconds. Minute 17
    # avoids GitHub's busy top of the hour.
    - cron: "17 * * * *"
  # "Run workflow" button: runs every on-duty Sara right now, whatever the schedule says
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is Sara due?
        id: due
        run: node src/due.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SARA_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - if: steps.due.outputs.due == 'true'
        run: npm ci

      - name: Run tests
        if: steps.due.outputs.due == 'true'
        run: npm test

      - name: Run Sara
        if: steps.due.outputs.due == 'true'
        run: npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SARA_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
