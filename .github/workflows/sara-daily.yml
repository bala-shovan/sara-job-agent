name: Sara daily run

on:
  schedule:
    # Backup timer only. GitHub often skips or delays these by hours, so the
    # main alarm clock is Supabase (supabase/009_alarm_clock.sql), which
    # dispatches this workflow every 15 minutes with force = false. Each wake
    # checks every person's schedule (time, days, time zone) and works only
    # for those who are due.
    - cron: "17 * * * *"
  # "Run workflow" button: runs on-duty Saras right now, whatever the schedule says.
  # Fill in "only" with someone's alert email to run just their Sara.
  workflow_dispatch:
    inputs:
      force:
        description: "Run every on-duty Sara now, whatever their schedule. Untick to run only the people who are due (this is what the Supabase alarm clock sends)."
        type: boolean
        default: true
      only:
        description: "Run only this person's Sara (their alert email). Leave empty to run everyone on duty."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sara-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Up to 50 people, one after another, about 1-2 minutes each
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is Sara due?
        id: due
        run: node src/due.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SARA_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}

      - if: steps.due.outputs.due == 'true'
        run: npm ci

      - name: Run tests
        if: steps.due.outputs.due == 'true'
        run: npm test

      - name: Run Sara
        if: steps.due.outputs.due == 'true'
        run: npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SARA_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          SARA_ONLY: ${{ github.event.inputs.only }}
